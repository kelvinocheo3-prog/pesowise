<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7355d9">
<meta name="description" content="A private, offline-first personal finance tracker.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PesoWise">
<title>PesoWise | Your money, in balance</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:Inter;src:url(assets/fonts/inter-latin-variable.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{--bg:#f5f3fb;--card:#fff;--ink:#241d3b;--mute:#6f6987;--line:#e6e1f4;--ac:#7355d9;--ac-ink:#fff;--hero:#3d2b8f;--exp:#d4503c;--inc:#137a55;--warn:#e0a21b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120f1d;--card:#1c1830;--ink:#ece8fa;--mute:#a49ec0;--line:#2c2647;--ac:#a48cff;--ac-ink:#150f2e;--hero:#2d2266;--exp:#f0745f;--inc:#3fc58f}}
:root[data-theme="dark"]{--bg:#120f1d;--card:#1c1830;--ink:#ece8fa;--mute:#a49ec0;--line:#2c2647;--ac:#a48cff;--ac-ink:#150f2e;--hero:#2d2266;--exp:#f0745f;--inc:#3fc58f}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:contain}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.ic{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{max-width:560px;margin:0 auto;padding:16px 16px calc(160px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.top h1{font-size:22px;font-weight:800;margin:0;display:flex;align-items:center;gap:10px}
.mark{width:36px;height:36px;border-radius:11px;background:var(--ac);color:var(--ac-ink);display:grid;place-items:center;font-weight:800}
.ib{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.hero{background:var(--hero);color:#fff;border-radius:28px;padding:24px 22px}
.hero small{opacity:.78;font-size:14px}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-.02em;margin:2px 0 18px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair div{background:rgba(255,255,255,.12);border-radius:16px;padding:12px 14px}
.pair b{display:block;font-size:17px}
h2{font-size:17px;font-weight:800;margin:26px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 16px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border:0}
.em{width:44px;height:44px;border-radius:14px;background:var(--bg);display:grid;place-items:center;font-size:22px;flex:none}
.grow{flex:1;min-width:0}
.grow b,.grow>span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow>span{color:var(--mute);font-size:13px}
.amt{font-weight:800;white-space:nowrap}.amt.expense{color:var(--exp)}.amt.income{color:var(--inc)}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:9px;background:var(--ac)}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.chip{min-height:44px;padding:0 16px;border-radius:22px;background:var(--card);border:1px solid var(--line);font-weight:700}
.chip.on{background:var(--ac);color:var(--ac-ink);border-color:var(--ac)}
.link{color:var(--ac);font-weight:700;min-height:44px;padding:0 6px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;z-index:5}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;justify-content:center;color:var(--mute);text-decoration:none;font-size:12px;font-weight:700}
nav a.on{color:var(--ac)}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(88px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;background:var(--ac);color:var(--ac-ink);display:grid;place-items:center;box-shadow:0 10px 24px rgba(115,85,217,.4);z-index:6}
.fab .ic{width:28px;height:28px;stroke-width:2.6}
.fab:active,.btn:active{transform:scale(.96)}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:none}
.shade.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:90%;overflow-y:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h3{margin:0 0 14px;font-size:19px;font-weight:800}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:16px;padding:4px;margin-bottom:14px}
.seg button{min-height:44px;border-radius:12px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.in{width:100%;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;padding:0 14px;margin-bottom:12px}
.in.amount{font-size:32px;font-weight:800;min-height:68px}
label{display:block;font-size:13px;color:var(--mute);font-weight:700;margin:0 0 6px}
.btn{width:100%;min-height:54px;border-radius:16px;background:var(--ac);color:var(--ac-ink);font-weight:800;font-size:17px;margin-top:6px}
.btn.ghost{background:var(--bg);color:var(--ink)}.btn.del{background:none;color:var(--exp)}
.err{color:var(--exp);font-size:14px;min-height:20px;margin:0 0 6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;z-index:20;font-weight:700}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<button class="fab" id="fab" aria-label="Add transaction"><svg class="ic"><use href="./assets/lucide-sprite.svg#plus"></use></svg></button>
<nav id="nav" aria-label="Main navigation"></nav>
<div class="shade" id="shade"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<script type="module">
import {initializeDatabase,getAll,putRecord,deleteRecord,getSetting,setSetting} from "./js/database.js";
import {validAmount,sumAmounts,cashBalance,budgetActual,savingsBalance} from "./js/finance.js";
const $=s=>document.querySelector(s);
const peso=n=>new Intl.NumberFormat("en-PH",{style:"currency",currency:"PHP"}).format(n||0);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(16).slice(2);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const mk=()=>today().slice(0,7);
const ic=n=>`<svg class="ic"><use href="./assets/lucide-sprite.svg#${n}"></use></svg>`;
const EM={Food:"🍚",Transportation:"🚌",Housing:"🏠",Utilities:"💡",Shopping:"🛍️",Healthcare:"💊",Education:"📚",Entertainment:"🎬","Personal Care":"🧴",Family:"👪",Salary:"💼",Business:"🏪",Freelance:"💻",Allowance:"🎒",Investment:"📈",Gifts:"🎁",Other:"✨"};
const em=c=>EM[c]||"🏷️";
const TABS=[["dashboard","Home","layout-dashboard"],["transactions","Activity","arrow-left-right"],["budgets","Budgets","wallet"],["savings","Savings","piggy-bank"],["reports","Reports","chart-no-axes-column-increasing"]];
let S={tx:[],budgets:[],goals:[],acts:[],cats:[]},filter="all",theme="auto";
async function load(){const [tx,budgets,goals,acts,cats]=await Promise.all(["transactions","budgets","savingsGoals","savingsActivities","categories"].map(getAll));S={tx,budgets,goals,acts,cats}}
const catsOf=k=>S.cats.filter(c=>c.kind===k).map(c=>c.name);
const inMonth=(t,m)=>t.date?.slice(0,7)===m;
const byDate=(a,b)=>b.date.localeCompare(a.date)||(b.createdAt||"").localeCompare(a.createdAt||"");
const toast=m=>{const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2400)};
const empty=(a,b)=>`<div class="empty"><b>${a}</b>${b}</div>`;
const top=t=>`<div class="top"><h1><span class="mark">₱</span>${t}</h1><button class="ib" data-a="settings" aria-label="Settings">${ic("settings")}</button></div>`;
const txRow=t=>`<button class="row" data-a="tx" data-id="${esc(t.id)}"><span class="em">${em(t.category)}</span><span class="grow"><b>${esc(t.description||t.category)}</b><span>${esc(t.category)} · ${t.date}</span></span><span class="amt ${t.type}">${t.type==="expense"?"−":"+"}${peso(t.amount)}</span></button>`;
const barColor=p=>p>=100?"var(--exp)":p>=80?"var(--warn)":"var(--ac)";

function view(){
  const r=(location.hash||"#dashboard").slice(1),page=TABS.some(t=>t[0]===r)?r:"dashboard";
  $("#app").innerHTML={dashboard:vDash,transactions:vAct,budgets:vBud,savings:vSav,reports:vRep}[page]();
  $("#nav").innerHTML=TABS.map(t=>`<a href="#${t[0]}" class="${t[0]===page?"on":""}" ${t[0]===page?'aria-current="page"':""}>${ic(t[2])}${t[1]}</a>`).join("");
  $("#fab").dataset.page=page;
}
function vDash(){
  const m=mk(),mt=S.tx.filter(t=>inMonth(t,m)),inc=sumAmounts(mt.filter(t=>t.type==="income")),exp=sumAmounts(mt.filter(t=>t.type==="expense"));
  const cats={};mt.filter(t=>t.type==="expense").forEach(t=>cats[t.category]=(cats[t.category]||0)+Number(t.amount));
  const tc=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,3),recent=[...S.tx].sort(byDate).slice(0,5);
  return top("PesoWise")+`<div class="hero"><small>Available balance</small><div class="big">${peso(cashBalance(S.tx))}</div><div class="pair"><div><small>Income this month</small><b>${peso(inc)}</b></div><div><small>Spent this month</small><b>${peso(exp)}</b></div></div></div>
  <h2>Where your money went</h2><div class="card">${tc.length?tc.map(([c,v])=>`<div class="row"><span class="em">${em(c)}</span><span class="grow"><b>${esc(c)}</b><div class="bar"><i style="width:${Math.round(v/exp*100)}%"></i></div></span><span class="amt">${peso(v)}</span></div>`).join(""):empty("No spending yet","Tap + to add your first expense.")}</div>
  <h2>Recent activity</h2><div class="card">${recent.length?recent.map(txRow).join(""):empty("Nothing here yet","Your latest transactions will show up here.")}</div>`;
}
function vAct(){
  const list=S.tx.filter(t=>filter==="all"||t.type===filter).sort(byDate),g={};list.forEach(t=>(g[t.date]=g[t.date]||[]).push(t));
  const yd=new Date(Date.now()-864e5).toISOString().slice(0,10),lab=d=>d===today()?"Today":d===yd?"Yesterday":d;
  return top("Activity")+`<div class="chips">${[["all","All"],["expense","Expenses"],["income","Income"]].map(c=>`<button class="chip ${filter===c[0]?"on":""}" data-a="filter" data-v="${c[0]}">${c[1]}</button>`).join("")}</div>`+
  (list.length?Object.keys(g).map(d=>`<h2>${lab(d)}</h2><div class="card">${g[d].map(txRow).join("")}</div>`).join(""):`<div class="card">${empty("No transactions","Tap + to record money coming in or going out.")}</div>`);
}
function vBud(){
  const m=mk();
  return top("Budgets")+`<div class="card">${catsOf("expense").map(c=>{const b=S.budgets.find(x=>x.month===m&&x.category===c),s=b?budgetActual(S.tx,b):0,p=b?s/b.amount*100:0;
  return `<button class="row" data-a="budget" data-c="${esc(c)}"><span class="em">${em(c)}</span><span class="grow"><b>${esc(c)}</b><span>${b?peso(s)+" of "+peso(b.amount):"Tap to set a monthly limit"}</span>${b?`<div class="bar"><i style="width:${Math.min(100,p)}%;background:${barColor(p)}"></i></div>`:""}</span></button>`}).join("")}</div>`;
}
function vSav(){
  return top("Savings goals")+`<button class="link" data-a="goal">+ New goal</button>`+(S.goals.length?S.goals.map(g=>{const cur=savingsBalance(g.id,S.acts),p=Math.max(0,Math.min(100,Math.round(cur/g.targetAmount*100)));
  return `<div class="card" style="margin-bottom:12px;padding:16px"><b style="font-size:18px">${esc(g.name)}</b><div style="color:var(--mute);font-size:14px">${peso(cur)} saved of ${peso(g.targetAmount)}${p>=100?" · Goal reached 🎉":""}</div><div class="bar"><i style="width:${p}%"></i></div><div style="display:flex;justify-content:space-between;margin-top:8px"><button class="link" data-a="activity" data-id="${esc(g.id)}">Deposit or withdraw</button><button class="link" data-a="delgoal" data-id="${esc(g.id)}" style="color:var(--exp)">Delete</button></div></div>`}).join(""):`<div class="card">${empty("No goals yet","Pick something to save for, like a phone or school fees.")}</div>`);
}
function vRep(){
  const ms=[],n=new Date();for(let i=5;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1);ms.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"))}
  const D=ms.map(m=>({m,i:sumAmounts(S.tx.filter(t=>t.type==="income"&&inMonth(t,m))),e:sumAmounts(S.tx.filter(t=>t.type==="expense"&&inMonth(t,m)))})),mx=Math.max(1,...D.map(x=>Math.max(x.i,x.e)));
  const nm=m=>new Date(m+"-01T00:00").toLocaleString("en",{month:"short"}),c=D[5].e,p=D[4].e;
  let msg="Add expenses to see how your spending changes.";
  if(p>0){const q=Math.round(Math.abs(c-p)/p*100);msg=c<=p?`You spent ${q}% less than last month.`:`You spent ${q}% more than last month.`}else if(c>0)msg="This is your first month of spending. Nice start!";
  const cats={};S.tx.filter(t=>t.type==="expense"&&inMonth(t,mk())).forEach(t=>cats[t.category]=(cats[t.category]||0)+Number(t.amount));
  const cl=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  return top("Reports")+`<div class="card" style="padding:16px"><b>${msg}</b><div style="display:flex;gap:10px;margin-top:16px">${D.map(x=>`<div style="flex:1;text-align:center"><div style="display:flex;gap:3px;align-items:flex-end;justify-content:center;height:110px"><i style="width:36%;height:${Math.max(2,x.i/mx*100)}%;background:var(--ac);border-radius:6px 6px 0 0"></i><i style="width:36%;height:${Math.max(2,x.e/mx*100)}%;background:var(--exp);border-radius:6px 6px 0 0"></i></div><small style="color:var(--mute)">${nm(x.m)}</small></div>`).join("")}</div><div style="margin-top:10px;font-size:13px;color:var(--mute)"><span style="color:var(--ac)">■</span> Income &nbsp; <span style="color:var(--exp)">■</span> Expenses</div></div>
  <h2>This month by category</h2><div class="card">${cl.length?cl.map(([k,v])=>`<div class="row"><span class="em">${em(k)}</span><span class="grow"><b>${esc(k)}</b></span><span class="amt">${peso(v)}</span></div>`).join(""):empty("No spending yet","Your categories will appear here.")}</div>
  <button class="btn ghost" style="margin-top:16px" data-a="csv">Export transactions (CSV)</button>`;
}

const sheet=h=>{$("#sheet").innerHTML=h;$("#shade").classList.add("show")};
const close=()=>$("#shade").classList.remove("show");
const refresh=async()=>{await load();view()};
$("#shade").addEventListener("click",e=>{if(e.target.id==="shade")close()});
const err=m=>{$("#er").textContent=m};

let d={};
function txSheet(){
  const L=catsOf(d.type);if(!L.includes(d.cat))d.cat=L[0];
  sheet(`<h3>${d.id?"Edit transaction":"Add transaction"}</h3><div class="seg"><button data-a="type" data-v="expense" class="${d.type==="expense"?"on":""}">Expense</button><button data-a="type" data-v="income" class="${d.type==="income"?"on":""}">Income</button></div>
  <label for="a">Amount</label><input class="in amount" id="a" inputmode="decimal" placeholder="₱0.00" value="${esc(d.amt||"")}">
  <label>Category</label><div class="chips">${L.map(c=>`<button class="chip ${d.cat===c?"on":""}" data-a="cat" data-v="${esc(c)}">${em(c)} ${esc(c)}</button>`).join("")}</div>
  <label for="n">Description (optional)</label><input class="in" id="n" placeholder="What was it for?" value="${esc(d.desc||"")}">
  <label for="dt">Date</label><input class="in" id="dt" type="date" value="${d.date||today()}">
  <div class="err" id="er"></div><button class="btn" data-a="save">Save</button>`);
  setTimeout(()=>$("#a")?.focus(),50);
}
const keep=()=>{d.amt=$("#a").value;d.desc=$("#n").value;d.date=$("#dt").value};
function amountSheet(title,label,val,onSave,extra=""){
  sheet(`<h3>${title}</h3>${extra}<label for="v">${label}</label><input class="in amount" id="v" inputmode="decimal" placeholder="₱0.00" value="${val||""}"><div class="err" id="er"></div><button class="btn" id="ok">Save</button>`);
  $("#ok").onclick=async()=>{const v=validAmount($("#v").value.replace(/,/g,""));if(!v)return err("Enter an amount above zero, with up to 2 decimals.");if(await onSave(v)!==false){close();await refresh()}};
  setTimeout(()=>$("#v").focus(),50);
}
function settings(){
  sheet(`<h3>Settings</h3><label>Theme</label><div class="chips">${[["auto","Auto"],["light","Light"],["dark","Dark"]].map(t=>`<button class="chip ${theme===t[0]?"on":""}" data-a="theme" data-v="${t[0]}">${t[1]}</button>`).join("")}</div><p style="color:var(--mute);font-size:14px">Your data stays on this device. Export a CSV from Reports to keep a copy. On Android, use your browser menu to install the app.</p><button class="btn ghost" data-a="close">Close</button>`);
}
const applyTheme=()=>theme==="auto"?document.documentElement.removeAttribute("data-theme"):document.documentElement.setAttribute("data-theme",theme);

document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,v=t.dataset.v,id=t.dataset.id;
  if(a==="close")close();
  else if(a==="settings")settings();
  else if(a==="theme"){theme=v;applyTheme();await setSetting("themeMode",v);settings()}
  else if(a==="filter"){filter=v;view()}
  else if(a==="type"){keep();d.type=v;txSheet()}
  else if(a==="cat"){keep();d.cat=v;txSheet()}
  else if(a==="save"){keep();const amt=validAmount(String(d.amt).replace(/,/g,""));if(!amt)return err("Enter an amount above zero, with up to 2 decimals.");
    const old=S.tx.find(x=>x.id===d.id),now=new Date().toISOString();
    await putRecord("transactions",{...old,id:old?.id||uid(),description:(d.desc||"").trim()||d.cat,amount:amt,category:d.cat,type:d.type,date:d.date||today(),notes:old?.notes||"",createdAt:old?.createdAt||now,updatedAt:now});
    close();await refresh();toast("Saved")}
  else if(a==="tx"){const x=S.tx.find(y=>y.id===id);if(!x)return;
    sheet(`<h3>${em(x.category)} ${esc(x.description||x.category)}</h3><p>${x.type==="expense"?"Expense":"Income"} of <b>${peso(x.amount)}</b> in ${esc(x.category)} on ${x.date}.</p><button class="btn" data-a="edit" data-id="${esc(x.id)}">Edit</button><button class="btn ghost" data-a="close">Close</button><button class="btn del" data-a="deltx" data-id="${esc(x.id)}">Delete this transaction</button>`)}
  else if(a==="edit"){const x=S.tx.find(y=>y.id===id);d={id:x.id,type:x.type,cat:x.category,amt:x.amount,desc:x.description,date:x.date};txSheet()}
  else if(a==="deltx"){if(confirm("Delete this transaction?")){await deleteRecord("transactions",id);close();await refresh();toast("Deleted")}}
  else if(a==="budget"){const c=t.dataset.c,b=S.budgets.find(x=>x.month===mk()&&x.category===c);
    amountSheet(c+" budget","Monthly limit",b?.amount,async n=>{const now=new Date().toISOString();await putRecord("budgets",{id:b?.id||uid(),month:mk(),category:c,amount:n,createdAt:b?.createdAt||now,updatedAt:now})});
    if(b){$("#sheet").insertAdjacentHTML("beforeend",`<button class="btn del" id="rm">Remove limit</button>`);$("#rm").onclick=async()=>{await deleteRecord("budgets",b.id);close();await refresh()}}}
  else if(a==="goal"){sheet(`<h3>New savings goal</h3><label for="gn">What are you saving for?</label><input class="in" id="gn" placeholder="e.g. New phone"><label for="gt">Target amount</label><input class="in amount" id="gt" inputmode="decimal" placeholder="₱0.00"><div class="err" id="er"></div><button class="btn" id="gs">Create goal</button>`);
    $("#gs").onclick=async()=>{const n=$("#gn").value.trim(),amt=validAmount($("#gt").value.replace(/,/g,""));if(!n||!amt)return err("Add a name and a target above zero.");const now=new Date().toISOString();
      await putRecord("savingsGoals",{id:uid(),name:n,targetAmount:amt,targetDate:"",completed:false,createdAt:now,updatedAt:now});close();await refresh()};setTimeout(()=>$("#gn").focus(),50)}
  else if(a==="activity"){const g=S.goals.find(x=>x.id===id);let kind="deposit";
    amountSheet(g.name,"Amount",0,async n=>{if(kind==="withdrawal"&&n>savingsBalance(g.id,S.acts)){err("You can’t withdraw more than you saved.");return false}
      await putRecord("savingsActivities",{id:uid(),goalId:g.id,type:kind,amount:n,date:today(),note:"",createdAt:new Date().toISOString(),linkedTransactionId:null})},
      `<div class="seg"><button id="k1" class="on">Deposit</button><button id="k2">Withdraw</button></div>`);
    $("#k1").onclick=()=>{kind="deposit";$("#k1").className="on";$("#k2").className=""};$("#k2").onclick=()=>{kind="withdrawal";$("#k2").className="on";$("#k1").className=""}}
  else if(a==="delgoal"){if(confirm("Delete this goal and its deposits?")){for(const x of S.acts.filter(z=>z.goalId===id)){await deleteRecord("savingsActivities",x.id);if(x.linkedTransactionId)await deleteRecord("transactions",x.linkedTransactionId)}await deleteRecord("savingsGoals",id);await refresh()}}
  else if(a==="csv"){const q=s=>`"${String(s??"").replace(/"/g,'""')}"`,rows=[["Date","Type","Category","Description","Amount"],...[...S.tx].sort(byDate).map(x=>[x.date,x.type,x.category,x.description,x.amount])];
    const u=URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(",")).join("\n")],{type:"text/csv"})),l=document.createElement("a");l.href=u;l.download="pesowise-transactions.csv";l.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
});
$("#fab").addEventListener("click",()=>{
  const p=$("#fab").dataset.page;
  if(p==="savings")document.querySelector('[data-a="goal"]')?.click();
  else if(p==="budgets")toast("Tap a category to set its limit");
  else{d={type:"expense",cat:"Food"};txSheet()}
});
window.addEventListener("hashchange",()=>{close();view();scrollTo(0,0)});
(async()=>{
  try{await initializeDatabase();theme=await getSetting("themeMode","auto");applyTheme();await load();view()}
  catch(e){$("#app").innerHTML=`<div class="card" style="margin-top:24px">${empty("Can’t open your data","Your browser blocked local storage. Turn off private browsing and reload.")}</div>`}
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
