<style>
@font-face{font-family:Inter;src:url(assets/fonts/inter-latin-variable.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{--bg:#fff;--card:#f1f1f1;--ink:#111;--mute:#585858;--line:#d4d4d4;--ac:#00f2fe;--ac-ink:#fff;--exp:#d93025;--inc:#188038;--warn:#f29900;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1f1f1f;--ink:#f2f2f2;--mute:#a3a3a3;--line:#333;--ac:#00f2fe;--ac-ink:#06213a;--exp:#ff7b72;--inc:#4cd37f}}
:root[data-theme="dark"]{--bg:#121212;--card:#1f1f1f;--ink:#f2f2f2;--mute:#a3a3a3;--line:#333;--ac:#00f2fe;--ac-ink:#06213a;--exp:#ff7b72;--inc:#4cd37f}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scrollbar-gutter:stable;overflow-x:clip}
body{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.4 Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:contain;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.ic{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{overflow-x:clip;max-width:560px;margin:0 auto;padding:10px 16px calc(110px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;z-index:6;height:60px;margin:-10px -16px 12px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.top small{display:block;color:var(--mute);font-size:11px;font-weight:600}
.top h1{font-size:18px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.1}
.top .logo, .logoimg{width:36px;height:36px;border-radius:10px;background-image:url("apple-touch-icon.png");background-size:cover;background-position:center;display:inline-block}
.ib{width:42px;height:42px;border-radius:999px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.hero{background:var(--bg);color:var(--ink);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,242,254,0.15);border-radius:28px;padding:20px;text-align:center;margin-bottom:12px}

/* Fluid Organic Neon Ring Style */
.ring{position:relative;width:210px;height:210px;margin:0 auto;display:block}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round}
.r0{stroke:var(--line);stroke-width:10;opacity:0.2}
.r1{stroke:url(#neonFluid);stroke-width:14;transition:stroke-dasharray 1.4s cubic-bezier(.22,1,.36,1);filter:url(#glowFilter)}
.ring-progress-wrapper{position:absolute;inset:0;transition:transform 1.4s cubic-bezier(.22,1,.36,1);transform:rotate(0deg);pointer-events:none}
.ring-head{position:absolute;top:2px;left:50%;width:22px;height:22px;background:radial-gradient(circle,#fff 20%,#00f2fe 60%,#4facfe 100%);border-radius:50%;transform:translateX(-50%);box-shadow:0 0 18px #00f2fe, 0 0 30px #00c6ff, 0 0 45px rgba(0,242,254,0.8)}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;padding:0 24px}
.ringtxt small{font-size:11px;font-weight:600;color:var(--mute)}
.ringtxt b{font-size:24px;font-weight:800;letter-spacing:-.03em}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 12px}
.stats small{display:block;color:var(--mute);font-size:11px;font-weight:600}
.stats b{font-size:14px;font-weight:800}
h2{font-size:15px;font-weight:800;letter-spacing:-.01em;margin:12px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 16px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border:0}
.em{width:40px;height:40px;border-radius:14px;background:var(--bg);display:grid;place-items:center;font-size:20px;flex:none}
.grow{flex:1;min-width:0}
.grow b,.grow>span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow>span{color:var(--mute);font-size:12px}
.amt{font-weight:800;white-space:nowrap;font-size:14px}.amt.expense{color:var(--exp)}.amt.income{color:var(--inc)}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:9px;background:var(--ac)}
.empty{text-align:center;color:var(--mute);padding:18px 10px;font-size:13px}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-weight:700;font-size:13px}
.chip.on{background:var(--ac);color:var(--ac-ink);border-color:var(--ac)}
.link{color:var(--ac);font-weight:700;min-height:40px;padding:0 6px;font-size:14px}

/* Centered Popup Modal */
.shade{position:fixed;inset:0;background:rgba(5,10,30,.5);z-index:10;visibility:hidden;opacity:0;transition:opacity .2s ease,visibility 0s .2s;display:grid;place-items:center;padding:16px}
.shade.show{visibility:visible;opacity:1;transition:opacity .2s ease}
.sheet{position:relative;width:100%;max-width:480px;background:var(--bg);border-radius:28px;padding:22px 20px;max-height:calc(100vh - 40px);overflow-y:auto;transform:scale(.95);transition:transform .2s cubic-bezier(.2,.8,.2,1);box-shadow:0 16px 40px rgba(0,0,0,.22);will-change:transform;overscroll-behavior:contain}
.shade.show .sheet{transform:scale(1)}
.sheet h3{margin:0 0 14px;font-size:18px;font-weight:800;letter-spacing:-.01em}

/* Sliding Segment Switcher Animation */
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:999px;padding:4px;margin-bottom:12px}
.seg button{position:relative;z-index:1;min-height:40px;border-radius:999px;font-weight:700;color:var(--mute);font-size:13px;transition:color .25s ease}
.seg button.on{color:var(--ink);box-shadow:none}
.seg-ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--bg);box-shadow:0 1px 4px rgba(0,0,0,.18);transition:transform .35s cubic-bezier(.22,1,.36,1)}
.seg.right .seg-ind{transform:translateX(100%)}

.in{width:100%;min-height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:0 14px;margin-bottom:10px;font-size:14px}
.in.amount{font-size:16px;font-weight:normal;min-height:48px;letter-spacing:0}
label{display:block;font-size:12px;color:var(--mute);font-weight:700;margin:0 0 4px}
.btn{width:100%;min-height:46px;border-radius:999px;background:var(--ac);color:var(--ac-ink);font-weight:800;font-size:15px;margin-top:6px}
.btn.ghost{background:var(--card);color:var(--ink)}.btn.del{background:none;color:var(--exp)}
.seg.stick{position:sticky;top:calc(env(safe-area-inset-top,0px) + 68px);z-index:4;background:var(--line)}
.err{color:var(--exp);font-size:13px;min-height:18px;margin:0 0 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;font-weight:700}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}

/* Splash screen */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .45s ease}
#splash.out{opacity:0;pointer-events:none}
#splogo{width:120px;height:120px;border-radius:28px;background-image:url("apple-touch-icon.png");background-size:cover;background-position:center}
#splash b{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:8px}
#splash span{color:var(--mute);font-size:14px}
#splash i{width:100px;height:4px;border-radius:4px;background:var(--line);overflow:hidden;position:relative;margin-top:12px}
#splash i::after{content:"";position:absolute;inset:0;background:var(--ac);transform-origin:left;animation:grow 1.3s ease-out both}

/* Install notice at the top */
.ibar{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);max-width:536px;margin:0 auto;background:#3a3a3a;color:#fff;border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 12px 30px rgba(0,0,0,.3);z-index:50;transform:translateY(-160%);visibility:hidden;transition:transform .5s cubic-bezier(.34,1.4,.64,1),visibility 0s .5s}
.ibar.show{transform:none;visibility:visible;transition:transform .5s cubic-bezier(.34,1.4,.64,1)}
.ibar .logo{width:36px;height:36px;border-radius:10px;background-size:cover;background-position:center}
.ibar .grow{font-weight:700;font-size:13px;line-height:1.3;white-space:normal}
.ibar .ib2{min-height:40px;padding:0 16px;border-radius:999px;background:var(--ac);color:var(--ac-ink);font-weight:700}
.ibar .x{width:36px;height:40px;font-size:16px;color:#fff}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-bottom:10px}.chips.scroll::-webkit-scrollbar{display:none}.chips.scroll .chip{flex:none}

/* Pill navigation with centered action button */
:root{--seg:#dde1e4}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--seg:#3a3a3a}}
:root[data-theme="dark"]{--seg:#3a3a3a}
nav{display:flex;align-items:center;justify-content:center;gap:10px;background:none;border:0;padding:0 14px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none;position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;z-index:5}
nav>*{pointer-events:auto}
.pill{position:relative;flex:1;display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:0 8px 22px rgba(0,0,0,.14),inset 0 1px 1px rgba(255,255,255,.7);align-items:center}
.pill a{position:relative;z-index:1;min-height:48px;border-radius:999px;color:var(--mute);font-size:11px;font-weight:600;gap:1px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none}
.pill a.on{color:var(--ink);font-weight:800}
.pill a .ic{width:20px;height:20px;transform:none!important;animation:none!important}
.ind{position:absolute;top:3px;bottom:3px;left:3px;width:30px;height:auto;border-radius:999px;background:var(--seg);transition:transform .45s cubic-bezier(.22,1,.36,1)}
.add{margin:0 4px;width:46px;height:46px;border:0;flex:none;z-index:2;box-shadow:0 8px 20px rgba(10,108,186,.38);background:var(--ac);color:var(--ac-ink);border-radius:50%;display:grid;place-items:center}
</style>
</head>

<script type="module">
import {initializeDatabase,getAll,putRecord,deleteRecord,getSetting,setSetting} from "./js/database.js";
import {validAmount,sumAmounts,cashBalance,budgetActual,savingsBalance,plannedBudgetTotal} from "./js/finance.js";
const $=s=>document.querySelector(s);
const peso=n=>new Intl.NumberFormat("en-PH",{style:"currency",currency:"PHP"}).format(n||0);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(16).slice(2);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const mk=()=>today().slice(0,7);
const ic=n=>`<svg class="ic"><use href="#${n}"></use></svg>`;
const EM={Food:"🍚",Transportation:"🚌",Housing:"🏠",Utilities:"💡",Shopping:"🛍️",Healthcare:"💊",Education:"📚",Entertainment:"🎬","Personal Care":"🧴",Family:"👪",Salary:"💼",Business:"🏪",Freelance:"💻",Allowance:"🎒",Investment:"📈",Gifts:"🎁",Other:"✨"};
const em=c=>EM[c]||"🏷️";
const TABS=[["dashboard","Home","layout-dashboard"],["transactions","Activity","arrow-left-right"],["plan","Plan","wallet"],["reports","Insights","chart-no-axes-column-increasing"]];
let S={tx:[],budgets:[],goals:[],acts:[],cats:[]},filter="all",theme="auto",planTab="budgets",curPage="dashboard";
async function load(){const [tx,budgets,goals,acts,cats]=await Promise.all(["transactions","budgets","savingsGoals","savingsActivities","categories"].map(getAll));S={tx,budgets,goals,acts,cats}}
const catsOf=k=>S.cats.filter(c=>c.kind===k).map(c=>c.name);
const inMonth=(t,m)=>t.date?.slice(0,7)===m;
const byDate=(a,b)=>b.date.localeCompare(a.date)||(b.createdAt||"").localeCompare(a.createdAt||"");
const toast=(m,ms=2400)=>{navigator.vibrate?.(12);const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),ms)};
const empty=(a,b)=>`<div class="empty"><b>${a}</b>${b}</div>`;
const top=(t,s="",logo=false)=>`<div class="top"><div style="display:flex;align-items:center;gap:12px">${logo?`<span class="logo logoimg" role="img" aria-label="Budget Wise"></span>`:""}<div>${s?`<small>${s}</small>`:""}<h1>${t}</h1></div></div><button class="ib" data-a="settings" aria-label="Settings">${ic("settings")}</button></div>`;
const txRow=t=>`<button class="row" data-a="tx" data-id="${esc(t.id)}"><span class="em">${em(t.category)}</span><span class="grow"><b>${esc(t.description||t.category)}</b><span>${esc(t.category)} ·${t.date}</span></span><span class="amt ${t.type}">${t.type==="expense"?"−":"+"}${peso(t.amount)}</span></button>`;

const placeInd = () => {
  const pill = $("#nav .pill");
  const ind = $("#nav .ind");
  if (!pill || !ind) return;
  const idx = Math.max(0, TABS.findIndex(t => t[0] === curPage));
  const links = pill.querySelectorAll("a");
  if (links[idx]) {
    const link = links[idx];
    ind.style.width = `${link.offsetWidth}px`; ind.style.transform = `translateX(${link.offsetLeft - 3}px)`;
  }
};

function view(){
  let r=(location.hash||"#dashboard").slice(1);
  if(r==="budgets"||r==="savings"){planTab=r==="savings"?"goals":"budgets";r="plan"}
  const page=TABS.some(t=>t[0]===r)?r:"dashboard";curPage=page;
  $("#app").innerHTML={dashboard:vDash,transactions:vAct,plan:vPlan,reports:vRep}[page]();
  const nv=$("#nav");
  if(!nv.children.length){
    const link=t=>`<a href="#${t[0]}">${ic(t[2])}${t[1]}</a>`;
    nv.innerHTML=`<div class="pill"><i class="ind"></i>${link(TABS[0])}${link(TABS[1])}<button class="add" data-a="add">${ic("plus")}</button>${link(TABS[2])}${link(TABS[3])}</div>`; } nv.querySelectorAll("a").forEach(a=>{const on=a.getAttribute("href")==="#"+page;a.classList.toggle("on",on);if(on)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")}); placeInd(); nv.querySelector(".add").setAttribute("aria-label",page==="plan"&&planTab==="goals"?"New savings goal":"Add transaction"); } let RING={},deferred=null; function vDash(){ const m=mk(),now=new Date(),dl=new Date(now.getFullYear(),now.getMonth()+1,0).getDate()-now.getDate()+1; const mt=S.tx.filter(t=>inMonth(t,m)),inc=sumAmounts(mt.filter(t=>t.type==="income")),exp=sumAmounts(mt.filter(t=>t.type==="expense")),bal=cashBalance(S.tx); const ts=sumAmounts(S.tx.filter(t=>t.type==="expense"&&t.date===today())),mb=S.budgets.filter(b=>b.month===m),hasB=mb.length>0,tot=hasB?plannedBudgetTotal(mb):0; const rem=hasB?tot-exp:bal,allow=Math.max(0,(rem+ts)/dl),left=allow-ts,frac=allow>0?Math.max(0,Math.min(1,left/allow)):0,C=408.4; RING={hasB,tot,exp,bal,rem,dl,allow,ts,left}; const recent=[...S.tx].sort(byDate).slice(0,5); const targetVal = Math.abs(left); const targetDeg = (1 - frac) * 360;  setTimeout(()=>{ const dotWrap = $("#ringProgress"); const ringCircle = $("#ringCircle"); const countEl = $("#ringCount"); if(dotWrap && ringCircle && countEl){ dotWrap.style.transform = `rotate(${targetDeg}deg)`;
      ringCircle.style.strokeDasharray = `${(C*frac).toFixed(1)}${C}`;
      
      const t0 = performance.now();
      const animCount = (t) => {
        const p = Math.min(1, (t - t0) / 1000);
        const k = 1 - Math.pow(1 - p, 3);
        countEl.textContent = peso(targetVal * k);
        if(p < 1) requestAnimationFrame(animCount);
      };
      requestAnimationFrame(animCount);
    }
  }, 50);

  return top("Budget Wise",now.toLocaleDateString("en-PH",{weekday:"long",month:"long",day:"numeric"}),true)+
  `<section class="hero"><button class="ring" data-a="ring" aria-label="Tap to see how this amount is worked out">
    <svg viewBox="0 0 140 140" aria-hidden="true">
      <circle class="r0" cx="70" cy="70" r="65"/>
      <circle id="ringCircle" class="r1" cx="70" cy="70" r="65" style="stroke-dasharray:0 408.4"/>

    <div id="ringProgress" class="ring-progress-wrapper" style="transform: rotate(0deg)"><div class="ring-head"></div></div>
    <span class="ringtxt">
      <small>${left>=0?"You can still spend today":"Over today’s limit by"}</small>
