<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0a6cba">
<meta name="description" content="Budget Wise: Track &amp; Save. A private, offline-first budget tracker.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget Wise">
<title>Budget Wise | Track &amp; Save</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:Inter;src:url(assets/fonts/inter-latin-variable.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{--bg:#f3f5fb;--card:#fff;--ink:#0b1b3a;--mute:#5b6a8c;--line:#e4e9f4;--ac:#2f4bff;--ac-ink:#fff;--hero:#2f4bff;--sun:#ffc933;--exp:#e5484d;--inc:#0f9d76;--warn:#f5a524;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070d1f;--card:#101a36;--ink:#eaf0ff;--mute:#93a1c4;--line:#1c2850;--ac:#8d9bff;--ac-ink:#070d1f;--hero:#1f2fa8;--exp:#ff7a7f;--inc:#35d0a5}}
:root[data-theme="dark"]{--bg:#070d1f;--card:#101a36;--ink:#eaf0ff;--mute:#93a1c4;--line:#1c2850;--ac:#8d9bff;--ac-ink:#070d1f;--hero:#1f2fa8;--exp:#ff7a7f;--inc:#35d0a5}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scrollbar-gutter:stable;overflow-x:clip}
body{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:contain;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.ic{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{overflow-x:clip;max-width:560px;margin:0 auto;padding:14px 16px calc(150px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.top small{display:block;color:var(--mute);font-size:14px;font-weight:600}
.top h1{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.1}
.ib{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.hero{background:var(--hero);color:#fff;border-radius:32px;padding:22px 20px 24px;text-align:center}
.ring{position:relative;width:216px;height:216px;margin:4px auto 14px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.r0{stroke:rgba(255,255,255,.2)}.r1{stroke:var(--sun)}
.ringtxt{position:absolute;inset:0;display:grid;place-content:center;gap:2px}
.ringtxt small{font-size:14px;opacity:.88;font-weight:600}
.ringtxt b{font-size:36px;font-weight:800;letter-spacing:-.03em}
.hero p{margin:0 auto;max-width:300px;font-size:14px;opacity:.92}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px}
.stats small{display:block;color:var(--mute);font-size:12px;font-weight:600}
.stats b{font-size:15px}
h2{font-size:18px;font-weight:800;letter-spacing:-.01em;margin:26px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:4px 16px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border:0}
.em{width:46px;height:46px;border-radius:16px;background:var(--bg);display:grid;place-items:center;font-size:22px;flex:none}
.grow{flex:1;min-width:0}
.grow b,.grow>span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow>span{color:var(--mute);font-size:13px}
.amt{font-weight:800;white-space:nowrap}.amt.expense{color:var(--exp)}.amt.income{color:var(--inc)}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:9px;background:var(--ac)}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.chip{min-height:44px;padding:0 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:700}
.chip.on{background:var(--ac);color:var(--ac-ink);border-color:var(--ac)}
.link{color:var(--ac);font-weight:700;min-height:44px;padding:0 6px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;z-index:5}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;justify-content:center;color:var(--mute);text-decoration:none;font-size:12px;font-weight:700}
nav a.on{color:var(--ac)}
.add{width:64px;height:64px;border-radius:50%;background:var(--ac);color:var(--ac-ink);display:grid;place-items:center;margin:-34px auto 0;border:5px solid var(--card);box-shadow:0 8px 20px rgba(47,75,255,.35)}
.add .ic{width:28px;height:28px;stroke-width:2.8}
.add:active,.btn:active{transform:scale(.95)}
.shade{position:fixed;inset:0;background:rgba(5,10,30,.5);z-index:10;visibility:hidden;opacity:0;transition:opacity .22s ease,visibility 0s .28s}
.shade.show{visibility:visible;opacity:1;transition:opacity .22s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:32px 32px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:calc(100% - 12px);overflow-y:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);will-change:transform;overscroll-behavior:contain}
.shade.show .sheet{transform:none}
.sheet h3{margin:0 0 14px;font-size:20px;font-weight:800;letter-spacing:-.01em}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:16px;padding:4px;margin-bottom:14px}
.seg button{min-height:44px;border-radius:12px;font-weight:700;color:var(--mute)}
.seg button.on,.seg .on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.16)}
.in{width:100%;min-height:52px;border-radius:16px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;padding:0 14px;margin-bottom:12px}
.in.amount{font-size:34px;font-weight:800;min-height:70px;letter-spacing:-.02em}
label{display:block;font-size:13px;color:var(--mute);font-weight:700;margin:0 0 6px}
.btn{width:100%;min-height:54px;border-radius:18px;background:var(--ac);color:var(--ac-ink);font-weight:800;font-size:17px;margin-top:6px}
.btn.ghost{background:var(--bg);color:var(--ink)}.btn.del{background:none;color:var(--exp)}
.seg.stick{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:4;background:var(--line)}
.err{color:var(--exp);font-size:14px;min-height:20px;margin:0 0 6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;z-index:20;font-weight:700}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}

/* Smooth motion */
#app{view-transition-name:page}
nav{view-transition-name:navbar}
::view-transition-old(navbar){display:none}
::view-transition-new(navbar){animation:none}
::view-transition-old(root),::view-transition-new(root){animation:none}
@keyframes outL{to{opacity:0;transform:translateX(-36px) scale(.97)}}
@keyframes outR{to{opacity:0;transform:translateX(36px) scale(.97)}}
@keyframes inR{from{opacity:0;transform:translateX(48px) scale(.95)}}
@keyframes inL{from{opacity:0;transform:translateX(-48px) scale(.95)}}
html[data-dir="fwd"]::view-transition-old(page){animation:.14s ease-in both outL}
html[data-dir="fwd"]::view-transition-new(page){animation:.45s cubic-bezier(.34,1.5,.64,1) both inR}
html[data-dir="back"]::view-transition-old(page){animation:.14s ease-in both outR}
html[data-dir="back"]::view-transition-new(page){animation:.45s cubic-bezier(.34,1.5,.64,1) both inL}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}}
#app.enter>*{animation:rise .55s cubic-bezier(.34,1.5,.64,1) both}
#app.enter>*:nth-child(2){animation-delay:.06s}#app.enter>*:nth-child(3){animation-delay:.12s}#app.enter>*:nth-child(4){animation-delay:.18s}#app.enter>*:nth-child(5){animation-delay:.24s}#app.enter>*:nth-child(n+6){animation-delay:.3s}
@keyframes pop2{from{transform:scale(.3);opacity:0}}
#app.enter .em{animation:pop2 .55s cubic-bezier(.34,1.8,.64,1) .25s both}
@keyframes pop{0%{transform:scale(.5) rotate(-12deg)}100%{transform:translateY(-2px) scale(1.08)}}
@keyframes toastIn{from{transform:translate(-50%,40px) scale(.7);opacity:0}}
.toast{animation:toastIn .5s cubic-bezier(.34,1.8,.64,1) both}
.add{transition:transform .3s cubic-bezier(.34,1.8,.64,1)}
.add:active{transform:scale(.85) rotate(90deg)}
nav a{transition:color .2s}nav a .ic{transition:transform .25s cubic-bezier(.2,.8,.2,1)}nav a.on .ic{transform:translateY(-2px) scale(1.08);animation:pop .5s cubic-bezier(.34,1.8,.64,1)}
.row,.chip,.seg button,.btn,.ib,.link{transition:background-color .15s,transform .15s,color .15s}
.row:active{background:var(--bg)}.ib:active,.chip:active{transform:scale(.95)}
@keyframes grow{from{transform:scaleX(0)}}
.bar i{transform-origin:left}
#app.enter .bar i{animation:grow .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes ring{from{stroke-dasharray:0 327}}
#app.enter .r1{animation:ring .9s cubic-bezier(.2,.8,.2,1) both}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
.hero .big{font-size:42px;font-weight:800;letter-spacing:-.03em;margin:4px 0 18px}
.hero small{font-size:14px;font-weight:600;opacity:.9}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}
.pair div{background:rgba(255,255,255,.14);border-radius:18px;padding:12px 14px}
.pair small{display:block;font-size:13px}
.pair b{font-size:18px}
.ring{display:block;background:none;padding:0}
.hint{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;font-weight:700;font-size:14px}
.q{width:24px;height:24px;border-radius:50%;background:#fff;color:#2f4bff;display:grid;place-items:center;font-weight:800;font-size:15px}
.ring:active{transform:scale(.97)}
.logo{border-radius:14px;object-fit:cover;flex:none}

/* Clean white style with light-gray cards and a blue accent */
:root{--bg:#fff;--card:#f1f1f1;--ink:#111;--mute:#585858;--line:#d4d4d4;--ac:#0a6cba;--ac-ink:#fff;--exp:#d93025;--inc:#188038;--warn:#f29900}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1f1f1f;--ink:#f2f2f2;--mute:#a3a3a3;--line:#333;--ac:#4aa3ff;--ac-ink:#06213a;--exp:#ff7b72;--inc:#4cd37f}}
:root[data-theme="dark"]{--bg:#121212;--card:#1f1f1f;--ink:#f2f2f2;--mute:#a3a3a3;--line:#333;--ac:#4aa3ff;--ac-ink:#06213a;--exp:#ff7b72;--inc:#4cd37f}
.top{position:sticky;top:0;z-index:6;height:68px;margin:-14px -16px 14px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.top h1{font-size:22px;letter-spacing:-.02em}
.top small{font-size:12px}
.top .logo{width:40px;height:40px;border-radius:12px}
.ib{background:var(--card);border-radius:999px}
.hero{background:var(--bg);color:var(--ink);border:1px solid var(--line);box-shadow:0 8px 22px rgba(0,0,0,.13);border-radius:28px}
.r0{stroke:var(--line)}.r1{stroke:var(--ac)}
.ringtxt small{color:var(--mute);opacity:1}
.stats div{background:var(--card)}
.chip,.seg,.seg button,.btn{border-radius:999px}
.chip{background:var(--bg)}
.chip.on{background:var(--ac);color:var(--ac-ink)}
.seg{background:var(--card)}
.seg button.on{background:var(--bg);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.seg.stick{top:calc(env(safe-area-inset-top,0px) + 76px);background:var(--line)}
.btn.ghost{background:var(--card)}
.sheet{background:var(--bg)}
.in{background:var(--card);border-radius:16px}
.add{box-shadow:0 8px 20px rgba(10,108,186,.38)}
/* Splash screen */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .45s ease}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:132px;height:132px;border-radius:32px;box-shadow:0 14px 36px rgba(10,108,186,.35);animation:splashPop .8s cubic-bezier(.34,1.6,.64,1) both}
#splash b{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:8px;animation:rise .6s .2s cubic-bezier(.34,1.5,.64,1) both}
#splash span{color:var(--mute);font-size:15px;animation:rise .6s .3s cubic-bezier(.34,1.5,.64,1) both}
#splash i{width:120px;height:4px;border-radius:4px;background:var(--line);overflow:hidden;position:relative;margin-top:14px}
#splash i::after{content:"";position:absolute;inset:0;background:var(--ac);transform-origin:left;animation:grow 1.3s ease-out both}
@keyframes splashPop{from{transform:scale(.5);opacity:0}}
/* Install notice at the top */
.ibar{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);max-width:536px;margin:0 auto;background:#3a3a3a;color:#fff;border-radius:20px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 12px 30px rgba(0,0,0,.3);z-index:50;transform:translateY(-160%);visibility:hidden;transition:transform .5s cubic-bezier(.34,1.4,.64,1),visibility 0s .5s}
.ibar.show{transform:none;visibility:visible;transition:transform .5s cubic-bezier(.34,1.4,.64,1)}
.ibar .logo{width:40px;height:40px;border-radius:12px}
.ibar .grow{font-weight:700;font-size:15px;line-height:1.3;white-space:normal}
.ibar .ib2{min-height:44px;padding:0 18px;border-radius:999px;background:var(--ac);color:var(--ac-ink);font-weight:700}
.ibar .x{width:40px;height:44px;font-size:18px;color:#fff}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}.chips.scroll::-webkit-scrollbar{display:none}.chips.scroll .chip{flex:none}

/* Normal text sizes + smoother sheet */
body{font-size:15px}
.top h1{font-size:20px}
.ringtxt b{font-size:32px}
.ringtxt small{font-size:13px}
h2{font-size:16px}
.stats b{font-size:14px}
.row .grow b{font-size:15px}
.amt{font-size:15px;font-weight:700}
.chip,.seg button{font-size:14px}
.link{font-size:15px}
.btn{font-size:16px}
.sheet h3{font-size:18px}
.sheet{will-change:transform;overscroll-behavior:contain}
.in{font-size:16px}
.in.amount{font-size:28px;min-height:60px}
.empty{font-size:14px}
.empty b{font-size:16px}
.ibar .grow{font-size:14px}
#splash b{font-size:26px}

/* Smoother, lighter motion: fade and short slide, no bounce, no scaling */
@keyframes vOut{to{opacity:0}}
@keyframes vInR{from{opacity:0;transform:translateX(24px)}}
@keyframes vInL{from{opacity:0;transform:translateX(-24px)}}
html[data-dir="fwd"]::view-transition-old(page),html[data-dir="back"]::view-transition-old(page){animation:.12s linear both vOut}
html[data-dir="fwd"]::view-transition-new(page){animation:.28s cubic-bezier(.22,1,.36,1) both vInR}
html[data-dir="back"]::view-transition-new(page){animation:.28s cubic-bezier(.22,1,.36,1) both vInL}
@keyframes rise2{from{opacity:0;transform:translateY(12px)}}
#app.enter>*{animation:rise2 .38s cubic-bezier(.22,1,.36,1) both}
#app.enter>*:nth-child(2){animation-delay:.04s}#app.enter>*:nth-child(3){animation-delay:.08s}#app.enter>*:nth-child(4){animation-delay:.12s}#app.enter>*:nth-child(5){animation-delay:.16s}#app.enter>*:nth-child(n+6){animation-delay:.2s}
#app.enter .em{animation:none}
#app.enter .bar i{animation-duration:.5s;animation-timing-function:cubic-bezier(.22,1,.36,1)}
#app.enter .r1{animation-duration:.7s;animation-timing-function:cubic-bezier(.22,1,.36,1)}
.sheet{transition:transform .32s cubic-bezier(.22,1,.36,1)}
.shade{transition:opacity .2s ease,visibility 0s .32s}.shade.show{transition:opacity .2s ease}
@keyframes navPop{from{transform:scale(.88)}}
nav a.on .ic{transform:translateY(-2px) scale(1.06);animation:navPop .3s cubic-bezier(.22,1,.36,1)}
@keyframes toastIn2{from{transform:translate(-50%,16px);opacity:0}}
.toast{animation:toastIn2 .3s cubic-bezier(.22,1,.36,1) both}
.ibar{transition:transform .4s cubic-bezier(.22,1,.36,1),visibility 0s .4s}.ibar.show{transition:transform .4s cubic-bezier(.22,1,.36,1)}
@keyframes splashPop2{from{transform:scale(.85);opacity:0}}
#splash{transition:opacity .35s ease}
#splogo{animation:splashPop2 .6s cubic-bezier(.22,1,.36,1) both}
#splash b{animation:rise2 .5s .15s cubic-bezier(.22,1,.36,1) both}
#splash span{animation:rise2 .5s .22s cubic-bezier(.22,1,.36,1) both}
.add{transition:transform .2s cubic-bezier(.22,1,.36,1)}
.add:active{transform:scale(.9)}
.btn:active,.ib:active,.chip:active{transform:scale(.97)}
.row,.chip,.seg button,.btn,.ib,.link{transition:background-color .12s,transform .12s,color .12s}

/* Final text sizes (smaller, like a normal phone app) */
body{font-size:14px}
.top h1{font-size:19px}
.top small{font-size:12px}
.ringtxt b{font-size:28px}
.ringtxt small{font-size:12px}
h2{font-size:15px}
.stats small{font-size:12px}
.stats b{font-size:13px}
.row .grow b{font-size:14px}
.grow>span{font-size:12px}
.amt{font-size:14px}
.chip,.seg button{font-size:13px}
.link{font-size:14px}
.btn{font-size:15px;min-height:50px}
.sheet h3{font-size:17px}
label{font-size:12px}
.in{font-size:15px;min-height:48px}
.in.amount{font-size:22px;font-weight:700;min-height:54px}
.empty{font-size:13px}
.empty b{font-size:15px}
nav a{font-size:11px}
.ibar .grow{font-size:13px}
#splash b{font-size:24px}

/* Aesthetic page change: a soft circle opens from the tab you tapped, the old page sinks back, content floats in */
@keyframes reveal{from{clip-path:circle(0 at var(--rx,50%) var(--ry,100%))}to{clip-path:circle(150vmax at var(--rx,50%) var(--ry,100%))}}
@keyframes sink{to{opacity:.55;transform:scale(.97)}}
html.reveal::view-transition-old(page){animation:.5s cubic-bezier(.4,0,.2,1) both sink}
html.reveal::view-transition-new(page){animation:.6s cubic-bezier(.22,1,.36,1) both reveal}
::view-transition-group(page){overflow:clip}
@keyframes float{from{opacity:0;transform:translateY(18px)}}
#app.enter>*{animation:float .5s cubic-bezier(.22,1,.36,1) both}
#app.enter>*:nth-child(1){animation-delay:.12s}#app.enter>*:nth-child(2){animation-delay:.18s}#app.enter>*:nth-child(3){animation-delay:.24s}#app.enter>*:nth-child(4){animation-delay:.30s}#app.enter>*:nth-child(5){animation-delay:.36s}#app.enter>*:nth-child(n+6){animation-delay:.42s}
/* sliding marker above the active tab */
.ind{position:absolute;top:0;left:0;width:30px;height:3px;border-radius:0 0 4px 4px;background:var(--ac);transition:transform .45s cubic-bezier(.22,1,.36,1)}
#app{background:var(--bg)}
/* normal-size amount field */
.in.amount{font-size:16px;font-weight:600;min-height:48px;letter-spacing:0}
.in.amount::placeholder{font-weight:500}

/* Pill navigation (like the Notes / Tasks switch) */
:root{--seg:#dde1e4}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--seg:#3a3a3a}}
:root[data-theme="dark"]{--seg:#3a3a3a}
nav{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0 14px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
nav>*{pointer-events:auto}
.pill{position:relative;flex:1;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:0 8px 22px rgba(0,0,0,.14),inset 0 1px 1px rgba(255,255,255,.7)}
.pill a{position:relative;z-index:1;min-height:54px;border-radius:999px;color:var(--mute);font-size:11px;font-weight:600;gap:2px}
.pill a.on{color:var(--ink);font-weight:800}
.pill a .ic{width:22px;height:22px;transform:none!important;animation:none!important}
.ind{top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/4);height:auto;border-radius:999px;background:var(--seg);transition:transform .45s cubic-bezier(.22,1,.36,1)}
.add{margin:0;width:56px;height:56px;border:0;flex:none}
/* Slide between pages */
@keyframes slOutL{to{transform:translateX(-28%);opacity:.55}}
@keyframes slOutR{to{transform:translateX(28%);opacity:.55}}
@keyframes slInR{from{transform:translateX(100%)}}
@keyframes slInL{from{transform:translateX(-100%)}}
html[data-dir="fwd"]::view-transition-old(page){animation:.43s cubic-bezier(.22,1,.36,1) both slOutL}
html[data-dir="fwd"]::view-transition-new(page){animation:.43s cubic-bezier(.22,1,.36,1) both slInR}
html[data-dir="back"]::view-transition-old(page){animation:.43s cubic-bezier(.22,1,.36,1) both slOutR}
html[data-dir="back"]::view-transition-new(page){animation:.43s cubic-bezier(.22,1,.36,1) both slInL}
@keyframes float2{from{opacity:0;transform:translateY(8px)}}
#app.enter>*{animation:float2 .35s cubic-bezier(.22,1,.36,1) both}
#app.enter>*:nth-child(1){animation-delay:0s}#app.enter>*:nth-child(2){animation-delay:.04s}#app.enter>*:nth-child(3){animation-delay:.08s}#app.enter>*:nth-child(4){animation-delay:.12s}#app.enter>*:nth-child(5){animation-delay:.16s}#app.enter>*:nth-child(n+6){animation-delay:.2s}
/* Live indicator */
.lv{display:flex;align-items:center;gap:8px}
.live{width:9px;height:9px;border-radius:50%;background:var(--inc);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(24,128,56,.45)}70%,100%{box-shadow:0 0 0 8px rgba(24,128,56,0)}}

/* + button in the middle of the pill */
.pill{grid-template-columns:repeat(5,1fr)}
.ind{width:calc((100% - 8px)/5)}
.pill .add{margin:0 auto;align-self:center;width:52px;height:52px;position:relative;z-index:2}

/* Hero card: glowing white ring with swirling cyan brush strokes (matches the video) */
.hero.orb{position:relative;display:grid;place-items:center;overflow:hidden;isolation:isolate;min-height:272px;padding:20px;text-align:center;color:#fff;background:radial-gradient(ellipse at 50% 48%,#061d3c 0%,#031020 48%,#01070e 100%);border:1px solid rgba(0,210,255,.16);box-shadow:0 16px 40px rgba(0,110,255,.18),inset 0 0 34px rgba(0,150,255,.08);border-radius:28px}
.hero.orb::before{content:"";position:absolute;width:240px;height:240px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:#087bff;opacity:.14;filter:blur(54px);pointer-events:none;z-index:-1}
.hero.orb .ring{position:relative;z-index:1;display:block;width:224px;height:224px;margin:0;padding:0;border:0;border-radius:50%;background:transparent}
.hero.orb .ring svg{width:100%;height:100%;display:block;overflow:visible;transform:none}
.hero.orb .o-halo{fill:none;stroke:#2fa6ff;stroke-width:5;opacity:.45}
.hero.orb .o-disc{fill:url(#oDisc);stroke:rgba(0,170,255,.18);stroke-width:1}
.hero.orb .o-in{fill:none;stroke:rgba(120,200,255,.13);stroke-width:.8}
.hero.orb .o-ring{fill:none;stroke:#f2fcff;stroke-width:1.7}
.hero.orb .o-hi{fill:none;stroke:#7ffcff;stroke-width:1.3;stroke-linecap:round;opacity:.85}
.hero.orb .sw path:not(.o-hi){stroke:rgba(0,225,255,.45);stroke-width:2;stroke-linejoin:round}
.hero.orb .sw{transform-box:view-box;transform-origin:60px 60px;opacity:0;animation:swirl 3.8s cubic-bezier(.45,.05,.4,.95) infinite}
.hero.orb .sw.b{animation-name:swirlB;animation-delay:.16s}
.hero.orb .sw.c{animation-name:swirlC;animation-delay:.34s}
@keyframes swirl{0%{transform:rotate(-8deg) scale(.5);opacity:0}9%{opacity:1}32%{transform:rotate(-120deg) scale(.95)}54%{transform:rotate(-215deg) scale(1.13)}76%{transform:rotate(-300deg) scale(1)}86%{transform:rotate(-335deg) scale(.7);opacity:.9}95%{transform:rotate(-355deg) scale(.4);opacity:0}100%{transform:rotate(-362deg) scale(.3);opacity:0}}
@keyframes swirlB{0%{transform:rotate(18deg) scale(.45);opacity:0}10%{opacity:1}34%{transform:rotate(-95deg) scale(.85)}56%{transform:rotate(-190deg) scale(1.06)}78%{transform:rotate(-285deg) scale(.9)}86%{transform:rotate(-325deg) scale(.65);opacity:.9}95%{transform:rotate(-345deg) scale(.4);opacity:0}100%{transform:rotate(-352deg) scale(.3);opacity:0}}
@keyframes swirlC{0%{transform:rotate(-30deg) scale(.5);opacity:0}12%{opacity:.95}36%{transform:rotate(-140deg) scale(.92)}58%{transform:rotate(-232deg) scale(1.16)}80%{transform:rotate(-318deg) scale(.95)}87%{transform:rotate(-340deg) scale(.7);opacity:.8}96%{transform:rotate(-362deg) scale(.4);opacity:0}100%{transform:rotate(-372deg) scale(.3);opacity:0}}
.hero.orb .ringtxt{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0 34px;pointer-events:none;text-align:center}
.hero.orb .ringtxt small{font-size:12px;font-weight:600;line-height:1.25;color:#a8d9ff;opacity:1}
.hero.orb .ringtxt b{font-weight:800;letter-spacing:-.03em;color:#fff;text-shadow:0 1px 12px rgba(0,150,255,.3)}
@media(prefers-reduced-motion:reduce){.hero.orb .sw{animation:none!important;opacity:0}.live{animation:none!important}}

/* Switch buttons: the white pill slides between the two choices */
.seg{position:relative}
.seg .knob{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/2);border-radius:999px;background:var(--bg);box-shadow:0 1px 4px rgba(0,0,0,.18);transition:transform .38s cubic-bezier(.22,1,.36,1);pointer-events:none}
.seg button{position:relative;z-index:1;background:none!important;box-shadow:none!important;transition:color .25s}
.seg button.on{color:var(--ink);font-weight:800}
.swapin{animation:float2 .32s cubic-bezier(.22,1,.36,1) both}
/* Popup in the middle of the screen */
.shade{display:grid;place-items:center;padding:16px}
.sheet{position:relative;left:auto;right:auto;bottom:auto;width:min(100%,420px);max-width:420px;margin:0;border-radius:24px;padding:20px 18px 18px;max-height:min(88vh,640px);max-height:min(88dvh,640px);background:var(--bg);box-shadow:0 24px 60px rgba(0,0,0,.3);transform:translateY(18px) scale(.94);opacity:0;transition:transform .34s cubic-bezier(.22,1,.36,1),opacity .24s ease}
.shade.show .sheet{transform:none;opacity:1}
</style>

<script type="module">
import {initializeDatabase,getAll,putRecord,deleteRecord,getSetting,setSetting} from "./js/database.js";
import {validAmount,sumAmounts,cashBalance,budgetActual,savingsBalance,plannedBudgetTotal} from "./js/finance.js";
const $=s=>document.querySelector(s);
const peso=n=>new Intl.NumberFormat("en-PH",{style:"currency",currency:"PHP"}).format(n||0);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(16).slice(2);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const mk=()=>today().slice(0,7);
const ic=n=>`<svg class="ic"><use href="#${n}"></use></svg>`;
const EM={Food:"🍚",Transportation:"🚌",Housing:"🏠",Utilities:"💡",Shopping:"🛍️",Healthcare:"💊",Education:"📚",Entertainment:"🎬","Personal Care":"🧴",Family:"👪",Salary:"💼",Business:"🏪",Freelance:"💻",Allowance:"🎒",Investment:"📈",Gifts:"🎁",Other:"✨"};
const em=c=>EM[c]||"🏷️";
const TABS=[["dashboard","Home","layout-dashboard"],["transactions","Activity","arrow-left-right"],["plan","Plan","wallet"],["reports","Insights","chart-no-axes-column-increasing"]];
let S={tx:[],budgets:[],goals:[],acts:[],cats:[]},filter="all",theme="auto",planTab="budgets",curPage="dashboard";
async function load(){const [tx,budgets,goals,acts,cats]=await Promise.all(["transactions","budgets","savingsGoals","savingsActivities","categories"].map(getAll));S={tx,budgets,goals,acts,cats}}
const catsOf=k=>S.cats.filter(c=>c.kind===k).map(c=>c.name);
const inMonth=(t,m)=>t.date?.slice(0,7)===m;
const byDate=(a,b)=>b.date.localeCompare(a.date)||(b.createdAt||"").localeCompare(a.createdAt||"");
const toast=(m,ms=2400)=>{navigator.vibrate?.(12);const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),ms)};
const empty=(a,b)=>`<div class="empty"><b>${a}</b>${b}</div>`;
const top=(t,s="",logo=false)=>`<div class="top"><div style="display:flex;align-items:center;gap:12px">${logo?`<span class="logo logoimg" role="img" aria-label="Budget Wise"></span>`:""}<div>${s?`<small>${s}</small>`:""}<h1>${t}</h1></div></div><button class="ib" data-a="settings" aria-label="Settings">${ic("settings")}</button></div>`;
const txRow=t=>`<button class="row" data-a="tx" data-id="${esc(t.id)}"><span class="em">${em(t.category)}</span><span class="grow"><b>${esc(t.description||t.category)}</b><span>${esc(t.category)} · ${t.date}</span></span><span class="amt ${t.type}">${t.type==="expense"?"−":"+"}${peso(t.amount)}</span></button>`;
const barColor=p=>p>=100?"var(--exp)":p>=80?"var(--warn)":"var(--ac)";

const placeInd=()=>{const i=$("#nav .ind");if(i)i.style.transform=`translateX(${(i=>i<2?i:i+1)(Math.max(0,TABS.findIndex(t=>t[0]===curPage)))*100}%)`};
function view(){
  let r=(location.hash||"#dashboard").slice(1);
  if(r==="budgets"||r==="savings"){planTab=r==="savings"?"goals":"budgets";r="plan"}
  const page=TABS.some(t=>t[0]===r)?r:"dashboard";curPage=page;
  $("#app").innerHTML={dashboard:vDash,transactions:vAct,plan:vPlan,reports:vRep}[page]();
  const nv=$("#nav"),link=t=>`<a href="#${t[0]}">${ic(t[2])}${t[1]}</a>`;
  if(!nv.children.length)nv.innerHTML=`<div class="pill"><i class="ind"></i>${TABS.slice(0,2).map(link).join("")}<button class="add" data-a="add">${ic("plus")}</button>${TABS.slice(2).map(link).join("")}</div>`;
  nv.querySelectorAll("a").forEach(a=>{const on=a.getAttribute("href")==="#"+page;a.classList.toggle("on",on);if(on)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  placeInd();
  nv.querySelector(".add").setAttribute("aria-label",page==="plan"&&planTab==="goals"?"New savings goal":"Add transaction");
}
let RING={},deferred=null;
function vDash(){
  const m=mk(),now=new Date(),dl=new Date(now.getFullYear(),now.getMonth()+1,0).getDate()-now.getDate()+1;
  const mt=S.tx.filter(t=>inMonth(t,m)),inc=sumAmounts(mt.filter(t=>t.type==="income")),exp=sumAmounts(mt.filter(t=>t.type==="expense")),bal=cashBalance(S.tx);
  const ts=sumAmounts(S.tx.filter(t=>t.type==="expense"&&t.date===today())),mb=S.budgets.filter(b=>b.month===m),hasB=mb.length>0,tot=hasB?plannedBudgetTotal(mb):0;
  const rem=hasB?tot-exp:bal,allow=Math.max(0,(rem+ts)/dl),left=allow-ts,frac=allow>0?Math.max(0,Math.min(1,left/allow)):0,C=326.7;
  RING={hasB,tot,exp,bal,rem,dl,allow,ts,left};
  const recent=[...S.tx].sort(byDate).slice(0,5);
  const dom=now.getDate(),dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),proj=exp>0?exp/dom*dim:0;
  return top("Budget Wise",now.toLocaleDateString("en-PH",{weekday:"long",month:"long",day:"numeric"}),true)+`<section class="hero orb"><button class="ring" data-a="ring" aria-label="Tap to see how this amount is worked out"><svg viewBox="0 0 120 120" aria-hidden="true"><defs><radialGradient id="oDisc" cx="50%" cy="42%" r="70%"><stop offset="0" stop-color="#0a3a72"/><stop offset=".7" stop-color="#062447"/><stop offset="1" stop-color="#041528"/></radialGradient><linearGradient id="oTeal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00f7dc"/><stop offset=".55" stop-color="#00dcf0"/><stop offset="1" stop-color="#14a8ff"/></linearGradient><linearGradient id="oBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17c2ff"/><stop offset="1" stop-color="#0a7dff"/></linearGradient><filter id="oBlur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter></defs><circle class="o-halo" cx="60" cy="60" r="52" filter="url(#oBlur)"/><circle class="o-disc" cx="60" cy="60" r="47.5"/><circle class="o-in" cx="60" cy="60" r="41"/><circle class="o-in" cx="60" cy="60" r="35"/><circle class="o-ring" cx="60" cy="60" r="51.5"/><g class="sw a"><path d="M12 86C22 126 90 132 110 88C88 116 36 118 12 86Z" fill="url(#oTeal)"/><path d="M20 98C40 118 86 116 100 98" class="o-hi"/></g><g class="sw b"><path d="M26 102C46 124 82 124 100 100C82 116 50 118 26 102Z" fill="url(#oBlue)"/><path d="M90 100C104 94 109 103 100 107C96 103 93 102 90 100Z" fill="url(#oTeal)"/></g><g class="sw c"><path d="M24 94C42 114 82 116 102 94" class="o-hi"/><path d="M40 108C54 114 70 114 82 108C70 110 54 110 40 108Z" fill="url(#oTeal)"/></g></svg><span class="ringtxt"><small>${left>=0?"You can still spend today":"Over today’s limit by"}</small><b data-count="${Math.abs(left)}" style="font-size:${peso(Math.abs(left)).length>10?19:24}px">${peso(Math.abs(left))}</b></span></button></section>
  <div class="stats"><div><small>Money you have</small><b data-count="${bal}">${peso(bal)}</b></div><div><small>Money in</small><b data-count="${inc}">${peso(inc)}</b></div><div><small>Money out</small><b data-count="${exp}">${peso(exp)}</b></div></div>
  ${exp>0?`<div class="card" style="padding:14px 16px;margin-top:12px"><div class="lv"><span class="live"></span><b>Live forecast</b></div><div style="color:var(--mute);margin-top:4px">At this pace you’ll spend about <b style="color:var(--ink)">${peso(proj)}</b> by the end of the month.${hasB?` That is ${peso(Math.abs(proj-tot))} <b style="color:${proj>tot?"var(--exp)":"var(--inc)"}">${proj>tot?"over":"under"}</b> your ${peso(tot)} budget.`:""}</div></div>`:""}
  <h2>Latest transactions</h2><div class="card">${recent.length?recent.map(txRow).join(""):empty("Nothing here yet","Tap the + button to add your first expense.")}</div>`;
}
function ringSheet(){
  const R=RING,st=(t,v,d)=>`<div style="padding:12px 0;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between;gap:12px"><b>${t}</b><b>${v}</b></div><div style="color:var(--mute);font-size:14px;margin-top:2px">${d}</div></div>`;
  sheet(`<h3>How your daily amount works</h3><p style="margin:0 0 6px;color:var(--mute)">This is how much you can spend today and still stay on track for the rest of the month.</p>`+
  st("1. Money left this month",peso(Math.max(0,R.rem)),R.hasB?`Your budgets add up to ${peso(R.tot)} and you have spent ${peso(R.exp)} so far this month.`:`You haven’t set any budgets yet, so we use the money you have now (${peso(R.bal)}).`)+
  st("2. Days left, including today",String(R.dl),"We spread your money evenly over these days.")+
  st("3. Your amount for each day",peso(R.allow),`${peso(Math.max(0,R.rem)+R.ts)} ÷ ${R.dl} days. Anything you spend today comes out of this amount.`)+
  st("4. Spent today",peso(R.ts),R.left>=0?`So you can still spend <b>${peso(R.left)}</b> today.`:`That is <b>${peso(-R.left)}</b> more than your amount for today.`)+
  `<p style="color:var(--mute);font-size:14px">The amount in the ring starts fresh every day and changes when you add or delete a transaction.</p>`+
  (R.hasB?"":`<button class="btn" data-a="gotoplan">Set a budget</button>`)+`<button class="btn ghost" data-a="close">Got it</button>`);
}
function vAct(){
  const list=S.tx.filter(t=>filter==="all"||t.type===filter).sort(byDate),g={};list.forEach(t=>(g[t.date]=g[t.date]||[]).push(t));
  const yd=new Date(Date.now()-864e5).toISOString().slice(0,10),tm=new Date(Date.now()+864e5).toISOString().slice(0,10),lab=d=>d===today()?"Today":d===yd?"Yesterday":d===tm?"Tomorrow":new Date(d+"T00:00").toLocaleDateString("en-PH",{month:"long",day:"numeric",year:"numeric"});
  return top("Activity")+`<div class="chips">${[["all","All"],["expense","Expenses"],["income","Income"]].map(c=>`<button class="chip ${filter===c[0]?"on":""}" data-a="filter" data-v="${c[0]}">${c[1]}</button>`).join("")}</div>`+
  (list.length?Object.keys(g).map(d=>`<h2>${lab(d)}</h2><div class="card">${g[d].map(txRow).join("")}</div>`).join(""):`<div class="card">${empty("No transactions","Tap + to record money coming in or going out.")}</div>`);
}
function swapPlan(v){
  if(v===planTab)return;
  planTab=v;
  const app=$("#app"),seg=app.querySelector(".seg.stick");
  if(!seg){view();return}
  seg.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  seg.querySelector(".knob").style.transform=`translateX(${v==="goals"?100:0}%)`;
  const tmp=document.createElement("div");tmp.innerHTML=vPlan();
  app.querySelector(".top").replaceWith(tmp.querySelector(".top"));
  [...app.children].forEach(c=>{if(c!==seg&&!c.classList.contains("top"))c.remove()});
  [...tmp.children].filter(c=>!c.classList.contains("top")&&!c.classList.contains("seg")).forEach(c=>{c.classList.add("swapin");app.append(c)});
  $("#nav .add")?.setAttribute("aria-label",v==="goals"?"New savings goal":"Add transaction");
}
function vPlan(){
  const m=mk(),seg=`<div class="seg stick"><i class="knob" style="transform:translateX(${planTab==="goals"?100:0}%)"></i><button data-a="plan" data-v="budgets" class="${planTab==="budgets"?"on":""}">Budgets</button><button data-a="plan" data-v="goals" class="${planTab==="goals"?"on":""}">Savings goals</button></div>`;
  if(planTab==="goals")return top("Plan","Save for what matters")+seg+`<button class="link" data-a="goal">+ New goal</button>`+(S.goals.length?S.goals.map(g=>{const cur=savingsBalance(g.id,S.acts),p=Math.max(0,Math.min(100,Math.round(cur/g.targetAmount*100)));
    return `<div class="card" style="margin-bottom:12px;padding:16px"><b style="font-size:15px">${esc(g.name)}</b><div style="color:var(--mute);font-size:14px">${peso(cur)} saved of ${peso(g.targetAmount)}${p>=100?" · Goal reached 🎉":""}</div><div class="bar"><i style="width:${p}%"></i></div><div style="display:flex;justify-content:space-between;margin-top:8px"><button class="link" data-a="activity" data-id="${esc(g.id)}">Deposit or withdraw</button><button class="link" data-a="delgoal" data-id="${esc(g.id)}" style="color:var(--exp)">Delete</button></div></div>`}).join(""):`<div class="card">${empty("No goals yet","Pick something to save for, like a phone or school fees.")}</div>`);
  const mb=S.budgets.filter(b=>b.month===m),tot=plannedBudgetTotal(mb),sp=sumAmounts(S.tx.filter(t=>t.type==="expense"&&inMonth(t,m)));
  return top("Plan","Budgets for this month")+seg+(mb.length?`<div class="stats" style="grid-template-columns:1fr 1fr;margin:0 0 12px"><div><small>Planned</small><b>${peso(tot)}</b></div><div><small>Spent so far</small><b>${peso(sp)}</b></div></div>`:"")+`<div class="card">${catsOf("expense").map(c=>{const b=mb.find(x=>x.category===c),s=b?budgetActual(S.tx,b):0,p=b?s/b.amount*100:0;
  return `<button class="row" data-a="budget" data-c="${esc(c)}"><span class="em">${em(c)}</span><span class="grow"><b>${esc(c)}</b><span>${b?peso(s)+" of "+peso(b.amount):"Tap to set a monthly limit"}</span>${b?`<div class="bar"><i style="width:${Math.min(100,p)}%;background:${barColor(p)}"></i></div>`:""}</span></button>`}).join("")}</div>`;
}
function vRep(){
  const ms=[],n=new Date();for(let i=5;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1);ms.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"))}
  const D=ms.map(m=>({m,i:sumAmounts(S.tx.filter(t=>t.type==="income"&&inMonth(t,m))),e:sumAmounts(S.tx.filter(t=>t.type==="expense"&&inMonth(t,m)))})),mx=Math.max(1,...D.map(x=>Math.max(x.i,x.e)));
  const nm=m=>new Date(m+"-01T00:00").toLocaleString("en",{month:"short"}),c=D[5].e,p=D[4].e;
  let msg="Add expenses to see how your spending changes.";
  if(p>0){const q=Math.round(Math.abs(c-p)/p*100);msg=c<=p?`You spent ${q}% less than last month.`:`You spent ${q}% more than last month.`}else if(c>0)msg="This is your first month of spending. Nice start!";
  const cats={};S.tx.filter(t=>t.type==="expense"&&inMonth(t,mk())).forEach(t=>cats[t.category]=(cats[t.category]||0)+Number(t.amount));
  const cl=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  return top("Insights","Last 6 months")+`<div class="card" style="padding:16px"><b>${msg}</b><div style="display:flex;gap:10px;margin-top:16px">${D.map(x=>`<div style="flex:1;text-align:center"><div style="display:flex;gap:3px;align-items:flex-end;justify-content:center;height:110px"><i style="width:36%;height:${Math.max(2,x.i/mx*100)}%;background:var(--ac);border-radius:6px 6px 0 0"></i><i style="width:36%;height:${Math.max(2,x.e/mx*100)}%;background:var(--exp);border-radius:6px 6px 0 0"></i></div><small style="color:var(--mute)">${nm(x.m)}</small></div>`).join("")}</div><div style="margin-top:10px;font-size:13px;color:var(--mute)"><span style="color:var(--ac)">■</span> Income &nbsp; <span style="color:var(--exp)">■</span> Expenses</div></div>
  <h2>This month by category</h2><div class="card">${cl.length?cl.map(([k,v])=>`<div class="row"><span class="em">${em(k)}</span><span class="grow"><b>${esc(k)}</b></span><span class="amt">${peso(v)}</span></div>`).join(""):empty("No spending yet","Your categories will appear here.")}</div>
  <button class="btn ghost" style="margin-top:16px" data-a="csv">Export transactions (CSV)</button>`;
}

const sheet=h=>{$("#sheet").innerHTML=h;$("#shade").classList.add("show")};
const close=()=>{document.activeElement?.blur?.();$("#shade").classList.remove("show")};
const bc="BroadcastChannel" in self?new BroadcastChannel("budgetwise"):null;
const sheetOpen=()=>$("#shade").classList.contains("show");
const live=async()=>{await load();if(!sheetOpen())view()};
if(bc)bc.onmessage=live;
const refresh=async()=>{await load();view();bc?.postMessage(1)};
let lastDay=today();
setInterval(()=>{if(today()!==lastDay){lastDay=today();if(!sheetOpen())view()}},30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){lastDay=today();live()}});
document.addEventListener("mousedown",e=>{if(e.target.closest("#sheet .chip, #sheet .seg button"))e.preventDefault()});
$("#shade").addEventListener("click",e=>{if(e.target.id==="shade")close()});
const err=m=>{$("#er").textContent=m};

let d={};
const chipsHtml=L=>L.map(c=>`<button class="chip ${d.cat===c?"on":""}" data-a="cat" data-v="${esc(c)}">${em(c)} ${esc(c)}</button>`).join("");
function txSheet(){
  const L=catsOf(d.type);if(!L.includes(d.cat))d.cat=L[0];
  sheet(`<h3>${d.id?"Edit transaction":"Add transaction"}</h3><div class="seg"><i class="knob" style="transform:translateX(${d.type==="income"?100:0}%)"></i><button data-a="type" data-v="expense" class="${d.type==="expense"?"on":""}">Expense</button><button data-a="type" data-v="income" class="${d.type==="income"?"on":""}">Income</button></div>
  <label for="a">Amount</label><input class="in amount" id="a" inputmode="decimal" placeholder="₱0.00" value="${esc(d.amt||"")}">
  <label>Category</label><div class="chips scroll" id="cats">${chipsHtml(L)}</div>
  <label for="n">Description (optional)</label><input class="in" id="n" placeholder="What was it for?" value="${esc(d.desc||"")}">
  <label for="dt">Date</label><input class="in" id="dt" type="date" value="${d.date||today()}">
  <div class="err" id="er"></div><button class="btn" data-a="save">Save</button>`);
  setTimeout(()=>$("#a")?.focus({preventScroll:true}),300);
}
const keep=()=>{d.amt=$("#a").value;d.desc=$("#n").value;d.date=$("#dt").value};
function amountSheet(title,label,val,onSave,extra=""){
  sheet(`<h3>${title}</h3>${extra}<label for="v">${label}</label><input class="in amount" id="v" inputmode="decimal" placeholder="₱0.00" value="${val||""}"><div class="err" id="er"></div><button class="btn" id="ok">Save</button>`);
  $("#ok").onclick=async()=>{const v=validAmount($("#v").value.replace(/,/g,""));if(!v)return err("Enter an amount above zero, with up to 2 decimals.");if(await onSave(v)!==false){close();await refresh()}};
  setTimeout(()=>$("#v")?.focus({preventScroll:true}),300);
}
function settings(){
  sheet(`<h3>Settings</h3><label>Install app</label>${instBlock()}<label>Theme</label><div class="chips">${[["auto","Auto"],["light","Light"],["dark","Dark"]].map(t=>`<button class="chip ${theme===t[0]?"on":""}" data-a="theme" data-v="${t[0]}">${t[1]}</button>`).join("")}</div><p style="color:var(--mute);font-size:14px">Your data stays on this device. Export a CSV from Reports to keep a copy. On Android, use your browser menu to install the app.</p><button class="btn ghost" data-a="close">Close</button>`);
}
const instBlock=()=>{const box=h=>`<div style="background:var(--bg);border-radius:18px;padding:14px;margin-bottom:16px">${h}</div>`;
  if(matchMedia("(display-mode: standalone)").matches)return box(`<b style="color:var(--inc)">✓ Installed on this phone</b>`);
  if(deferred)return box(`<div style="display:flex;gap:12px;align-items:center;margin-bottom:10px"><span class="logo logoimg" role="img" aria-label="Budget Wise"></span><span style="color:var(--mute);font-size:14px">Add Budget Wise to your home screen. It opens like a real app, even without internet.</span></div><button class="btn" data-a="install" style="margin:0">Install app</button>`);
  return box(`<span style="color:var(--mute);font-size:14px">To install, open this page in <b>Chrome</b>, tap the <b>⋮</b> menu, then tap <b>Install app</b> or <b>Add to Home screen</b>.</span>`)};
let barT;
const hideBar=()=>{clearTimeout(barT);$("#ibar").classList.remove("show")};
function showInstall(){
  if(!deferred||matchMedia("(display-mode: standalone)").matches||curPage!=="dashboard")return;
  try{if(sessionStorage.getItem("pw-bar"))return;sessionStorage.setItem("pw-bar","1")}catch(e){}
  $("#ibar").classList.add("show");clearTimeout(barT);barT=setTimeout(hideBar,8000);
}
const applyTheme=()=>theme==="auto"?document.documentElement.removeAttribute("data-theme"):document.documentElement.setAttribute("data-theme",theme);

document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,v=t.dataset.v,id=t.dataset.id;
  if(a==="add"){if(curPage==="plan"&&planTab==="goals")document.querySelector('[data-a="goal"]')?.click();else{d={type:"expense",cat:"Food"};txSheet()}}
  else if(a==="plan")swapPlan(v)
  else if(a==="ring")ringSheet();
  else if(a==="ibarx")hideBar();
  else if(a==="install"){hideBar();if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;close();view()}
  else if(a==="gotoplan"){close();planTab="budgets";location.hash="plan"}
  else if(a==="close")close();
  else if(a==="settings")settings();
  else if(a==="theme"){theme=v;applyTheme();await setSetting("themeMode",v);settings()}
  else if(a==="filter"){filter=v;view()}
  else if(a==="type"){d.type=v;d.cat=catsOf(v)[0];document.querySelectorAll('#sheet [data-a="type"]').forEach(b=>b.classList.toggle("on",b.dataset.v===v));$("#sheet .seg .knob").style.transform=`translateX(${v==="income"?100:0}%)`;$("#cats").innerHTML=chipsHtml(catsOf(v));$("#cats").scrollLeft=0}
  else if(a==="cat"){d.cat=v;document.querySelectorAll("#cats .chip").forEach(b=>b.classList.toggle("on",b.dataset.v===v))}
  else if(a==="save"){keep();const amt=validAmount(String(d.amt).replace(/,/g,""));if(!amt)return err("Enter an amount above zero, with up to 2 decimals.");
    const old=S.tx.find(x=>x.id===d.id),now=new Date().toISOString();
    const pctOf=()=>{const b=S.budgets.find(x=>x.month===mk()&&x.category===d.cat);return b?{b,p:budgetActual(S.tx,b)/b.amount*100}:null};
    const before=d.type==="expense"?pctOf():null;
    await putRecord("transactions",{...old,id:old?.id||uid(),description:(d.desc||"").trim()||d.cat,amount:amt,category:d.cat,type:d.type,date:d.date||today(),notes:old?.notes||"",createdAt:old?.createdAt||now,updatedAt:now});
    close();await refresh();
    const after=d.type==="expense"?pctOf():null;
    if(after&&after.p>=100&&(!before||before.p<100)){toast(`⚠️ ${d.cat} is over budget by ${peso(budgetActual(S.tx,after.b)-after.b.amount)}`,4500);navigator.vibrate?.([40,60,40])}
    else if(after&&after.p>=80&&(!before||before.p<80))toast(`${d.cat} is at ${Math.round(after.p)}% of its budget`,4000);
    else toast("Saved")}
  else if(a==="tx"){const x=S.tx.find(y=>y.id===id);if(!x)return;
    sheet(`<h3>${em(x.category)} ${esc(x.description||x.category)}</h3><p>${x.type==="expense"?"Expense":"Income"} of <b>${peso(x.amount)}</b> in ${esc(x.category)} on ${x.date}.</p><button class="btn" data-a="edit" data-id="${esc(x.id)}">Edit</button><button class="btn ghost" data-a="close">Close</button><button class="btn del" data-a="deltx" data-id="${esc(x.id)}">Delete this transaction</button>`)}
  else if(a==="edit"){const x=S.tx.find(y=>y.id===id);d={id:x.id,type:x.type,cat:x.category,amt:x.amount,desc:x.description,date:x.date};txSheet()}
  else if(a==="deltx"){if(confirm("Delete this transaction?")){await deleteRecord("transactions",id);close();await refresh();toast("Deleted")}}
  else if(a==="budget"){const c=t.dataset.c,b=S.budgets.find(x=>x.month===mk()&&x.category===c);
    amountSheet(c+" budget","Monthly limit",b?.amount,async n=>{const now=new Date().toISOString();await putRecord("budgets",{id:b?.id||uid(),month:mk(),category:c,amount:n,createdAt:b?.createdAt||now,updatedAt:now})});
    if(b){$("#sheet").insertAdjacentHTML("beforeend",`<button class="btn del" id="rm">Remove limit</button>`);$("#rm").onclick=async()=>{await deleteRecord("budgets",b.id);close();await refresh()}}}
  else if(a==="goal"){sheet(`<h3>New savings goal</h3><label for="gn">What are you saving for?</label><input class="in" id="gn" placeholder="e.g. New phone"><label for="gt">Target amount</label><input class="in amount" id="gt" inputmode="decimal" placeholder="₱0.00"><div class="err" id="er"></div><button class="btn" id="gs">Create goal</button>`);
    $("#gs").onclick=async()=>{const n=$("#gn").value.trim(),amt=validAmount($("#gt").value.replace(/,/g,""));if(!n||!amt)return err("Add a name and a target above zero.");const now=new Date().toISOString();
      await putRecord("savingsGoals",{id:uid(),name:n,targetAmount:amt,targetDate:"",completed:false,createdAt:now,updatedAt:now});close();await refresh()};setTimeout(()=>$("#gn")?.focus({preventScroll:true}),300)}
  else if(a==="activity"){const g=S.goals.find(x=>x.id===id);let kind="deposit";
    amountSheet(g.name,"Amount",0,async n=>{if(kind==="withdrawal"&&n>savingsBalance(g.id,S.acts)){err("You can’t withdraw more than you saved.");return false}
      await putRecord("savingsActivities",{id:uid(),goalId:g.id,type:kind,amount:n,date:today(),note:"",createdAt:new Date().toISOString(),linkedTransactionId:null})},
      `<div class="seg"><i class="knob"></i><button id="k1" class="on">Deposit</button><button id="k2">Withdraw</button></div>`);
    $("#k1").onclick=()=>{kind="deposit";$("#k1").className="on";$("#k2").className="";$("#sheet .knob").style.transform="translateX(0)"};$("#k2").onclick=()=>{kind="withdrawal";$("#k2").className="on";$("#k1").className="";$("#sheet .knob").style.transform="translateX(100%)"}}
  else if(a==="delgoal"){if(confirm("Delete this goal and its deposits?")){for(const x of S.acts.filter(z=>z.goalId===id)){await deleteRecord("savingsActivities",x.id);if(x.linkedTransactionId)await deleteRecord("transactions",x.linkedTransactionId)}await deleteRecord("savingsGoals",id);await refresh()}}
  else if(a==="csv"){const q=s=>`"${String(s??"").replace(/"/g,'""')}"`,rows=[["Date","Type","Category","Description","Amount"],...[...S.tx].sort(byDate).map(x=>[x.date,x.type,x.category,x.description,x.amount])];
    const u=URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(",")).join("\n")],{type:"text/csv"})),l=document.createElement("a");l.href=u;l.download="budgetwise-transactions.csv";l.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
});
const calm=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
function enter(){
  if(calm())return;
  const a=$("#app");a.classList.remove("enter");void a.offsetWidth;a.classList.add("enter");setTimeout(()=>a.classList.remove("enter"),900);
  document.querySelectorAll("[data-count]").forEach(el=>{const v=+el.dataset.count,t0=performance.now(),f=t=>{const p=Math.min(1,(t-t0)/650),k=1-Math.pow(1-p,3);el.textContent=peso(v*k);if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)});
}
const order=["dashboard","transactions","plan","reports"];
const pageOf=()=>{let p=(location.hash||"#dashboard").slice(1);if(p==="budgets"||p==="savings")p="plan";return order.includes(p)?p:"dashboard"};
let vt;
function go(){
  close();
  const from=order.indexOf(curPage),to=order.indexOf(pageOf()),swap=()=>{view();scrollTo(0,0);enter();showInstall()};
  if(from===to){swap();return}
  const R=document.documentElement,dir=to>from?"fwd":"back",calmMotion=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(document.startViewTransition&&!calmMotion){R.dataset.dir=dir;vt?.skipTransition?.();vt=document.startViewTransition(swap);vt.finished.finally(()=>{delete R.dataset.dir})}
  else{swap();if(!calmMotion)$("#app").animate([{transform:`translateX(${dir==="fwd"?40:-40}px)`,opacity:0},{transform:"none",opacity:1}],{duration:320,easing:"cubic-bezier(.22,1,.36,1)"})}
}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;if(!$("#splash"))showInstall()});
window.addEventListener("appinstalled",()=>{deferred=null;toast("Budget Wise installed")});
window.addEventListener("hashchange",go);
(async()=>{
  try{await initializeDatabase();theme=await getSetting("themeMode","auto");applyTheme();await load();view()}
  catch(e){$("#app").innerHTML=`<div class="card" style="margin-top:24px">${empty("Can’t open your data","Your browser blocked local storage. Turn off private browsing and reload.")}</div>`}
  const sp=$("#splash");
  setTimeout(()=>{sp.classList.add("out");setTimeout(()=>{sp.remove();enter();showInstall()},450)},Math.max(0,1500-performance.now()));
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
</html>
